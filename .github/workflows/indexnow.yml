name: IndexNow URL Submission

on:
  push:
    branches:
      - main
    paths:
      - 'src/app/data/blogs/**'
      - 'src/app/data/blogsData.ts'
      - 'src/app/pages/**'
      - 'public/sitemap.xml'

jobs:
  indexnow:
    name: Submit Changed URLs to IndexNow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Submit changed URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          node scripts/submit-indexnow.mjs --git-diff
